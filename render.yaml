services:
  # ==============================================================
  # 1. Backend Web Service (Node.js + Express + Prisma PostgreSQL)
  # ==============================================================
  - type: web
    name: medipulse-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: cp prisma/schema.postgresql.prisma prisma/schema.prisma && npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run seed && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: postgresql://rocketwheel_op_user:0YYh9BNKP8iDBxoMbGVXfPqCN8bnNJZQ@dpg-dasjahojo6nc73c1n0cg-a.oregon-postgres.render.com/rocketwheel_op
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://rocketwheelmedpuls.onrender.com
      - key: BASE_URL
        value: https://medipulse-backend-veca.onrender.com
      - key: PLATFORM_FEE
        value: 20
      - key: PAYMENT_MODE
        value: demo
      - key: OTP_MODE
        value: console

  # ==============================================================
  # 2. Frontend Application (React 18 + Vite + Tailwind SPA)
  # ==============================================================
  - type: web
    name: rocketwheelmedpuls
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://medipulse-backend-veca.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://medipulse-backend-veca.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://medipulse-backend-veca.onrender.com/api


