version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medipulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medipulse_admin
      POSTGRES_PASSWORD: medipulse_secure_password_2026
      POSTGRES_DB: medipulse_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medipulse_admin -d medipulse_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medipulse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medipulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://medipulse_admin:medipulse_secure_password_2026@postgres:5432/medipulse_db?schema=public
      JWT_SECRET: medipulse_production_jwt_secret_key_2026_super_secure
      JWT_REFRESH_SECRET: medipulse_production_jwt_refresh_secret_key_2026
      RAZORPAY_KEY_ID: rzp_test_medipulse_demo_key
      RAZORPAY_KEY_SECRET: rzp_test_medipulse_secret_sample
      RAZORPAY_WEBHOOK_SECRET: sample_webhook_secret_medipulse_2026
      CLIENT_URL: http://localhost:80
      BASE_URL: http://localhost:5000
      PLATFORM_FEE: 20
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medipulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  postgres_data:
  redis_data:
